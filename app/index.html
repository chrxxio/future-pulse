<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futures Pulse</title>
<meta name="description" content="Live support/resistance levels, sentiment and market-moving news for CME micro futures.">
<meta name="theme-color" content="#121821" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F4F6F9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9; --panel:#FFFFFF; --panel2:#EEF2F6; --line:#DCE2E9; --text:#17202B; --muted:#5B6878;
  --bull:#11806A; --bear:#C9472B; --brass:#9A6E00;
  --bull-bg:rgba(17,128,106,.11); --bear-bg:rgba(201,71,43,.10); --brass-bg:rgba(154,110,0,.12);
  --tape:#B98500;
  --r-lg:16px; --r-sm:8px;
  --cond:72%;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121821; --panel:#19212C; --panel2:#1F2935; --line:#2A3544; --text:#E5EAF1; --muted:#8E9AAA;
    --bull:#3CC4A6; --bear:#FF7C5C; --brass:#E9B740;
    --bull-bg:rgba(60,196,166,.13); --bear-bg:rgba(255,124,92,.12); --brass-bg:rgba(233,183,64,.14);
    --tape:#E9B740; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121821; --panel:#19212C; --panel2:#1F2935; --line:#2A3544; --text:#E5EAF1; --muted:#8E9AAA;
  --bull:#3CC4A6; --bear:#FF7C5C; --brass:#E9B740;
  --bull-bg:rgba(60,196,166,.13); --bear-bg:rgba(255,124,92,.12); --brass-bg:rgba(233,183,64,.14);
  --tape:#E9B740; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums; -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--tape);outline-offset:2px;border-radius:6px}
.num{font-stretch:var(--cond);font-weight:650;letter-spacing:.005em}
.muted{color:var(--muted)}
.up{color:var(--bull)} .down{color:var(--bear)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0 8px}
.brand{font-stretch:var(--cond);font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1}
.brand{min-width:0}
.brand small{display:block;font-stretch:100%;font-weight:450;font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.fresh{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 10px;border-radius:999px;background:var(--panel2);white-space:nowrap;flex:none}
.fresh i{width:8px;height:8px;border-radius:50%;background:var(--bull)}
.fresh.aging i{background:var(--brass)} .fresh.stale i{background:var(--bear)}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel2)}
.iconbtn svg{width:18px;height:18px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.macro{display:flex;gap:18px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;font-size:13px}
.macro::-webkit-scrollbar{display:none}
.macro div{white-space:nowrap}
.macro b{font-stretch:var(--cond);font-weight:650;font-size:14px;margin:0 3px}

/* ---------- banners ---------- */
.note{margin:12px 0 0;padding:10px 12px;border-radius:var(--r-sm);font-size:14px;background:var(--brass-bg)}
.note.bad{background:var(--bear-bg)}
.breaking{display:block;margin:12px 0 0;padding:10px 12px 10px 14px;border-left:3px solid var(--tape);background:var(--panel);border-radius:0 var(--r-sm) var(--r-sm) 0;text-decoration:none}
.breaking strong{font-weight:650}
.breaking .meta{font-size:12.5px;color:var(--muted);margin-top:3px}

/* ---------- board ---------- */
.board{margin:12px 0 0;background:var(--panel);border-radius:var(--r-lg);overflow:hidden}
.row{display:block;width:100%;text-align:left;padding:14px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:active{background:var(--panel2)}
.r1{display:flex;align-items:baseline;gap:10px}
.sym{font-stretch:var(--cond);font-weight:800;font-size:21px;letter-spacing:.01em;min-width:52px}
.px{font-stretch:var(--cond);font-weight:650;font-size:21px;margin-left:auto}
.chg{font-size:14px;min-width:64px;text-align:right}
.r2{display:flex;align-items:center;gap:8px;margin-top:2px;font-size:13px;color:var(--muted)}
.r2 .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.bull{background:var(--bull-bg);color:var(--bull)} .pill.bear{background:var(--bear-bg);color:var(--bear)}
.pill.flat{background:var(--panel2);color:var(--muted)}
.rail{margin-top:10px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;font-size:12.5px}
.rail .lv{font-stretch:var(--cond);font-weight:600;font-size:13.5px}
.rail .lv span{display:block;font-stretch:100%;font-weight:400;font-size:11.5px;color:var(--muted)}
.rail .lv.r{text-align:right}
.track{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--bull) 45%,transparent),var(--panel2) 50%,color-mix(in srgb,var(--bear) 45%,transparent))}
.track i{position:absolute;top:50%;width:4px;height:16px;border-radius:2px;background:var(--tape);transform:translate(-50%,-50%)}
.err{font-size:13px;color:var(--bear);margin-top:4px}

/* ---------- tabs ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--panel) 94%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--text)}
nav.tabs button[aria-current="page"] svg{color:var(--tape)}
.badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bear);color:#fff;font-size:10.5px;line-height:16px;font-weight:700}

/* ---------- lists (news / events / alerts) ---------- */
h2.sec{font-size:17px;font-weight:700;margin:22px 0 8px;letter-spacing:-.005em}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.list{margin:12px 0 0;background:var(--panel);border-radius:var(--r-lg);overflow:hidden}
.item{padding:13px 16px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item a.t{text-decoration:none;font-weight:560;font-size:15.5px;line-height:1.35;display:block}
.item .meta{font-size:12.5px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.fx span{font-stretch:var(--cond);font-weight:650;font-size:13px;padding:1px 7px;border-radius:5px}
.fx .u{background:var(--bull-bg);color:var(--bull)} .fx .d{background:var(--bear-bg);color:var(--bear)}
.why{font-size:12.5px;color:var(--muted);margin-top:5px}
.imp{font-weight:650}
.imp.high{color:var(--bear)} .imp.med{color:var(--brass)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--tape);margin-right:2px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}
.dayhead{padding:9px 16px;font-size:13px;font-weight:650;background:var(--panel2);color:var(--muted)}
.ev{display:grid;grid-template-columns:62px 1fr;gap:10px}
.ev .tm{font-stretch:var(--cond);font-weight:650;font-size:15px}
.ev .tm span{display:block;font-stretch:100%;font-weight:400;font-size:11.5px;color:var(--muted)}

/* ---------- detail ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}
.sheet header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.sheet header .bar{padding:8px 0}
.back{display:flex;align-items:center;gap:4px;font-size:15px;padding:6px 8px 6px 0}
.back svg{width:20px;height:20px}
.hero{padding:16px 0 4px}
.hero .sym{font-size:30px}
.hero .big{font-stretch:var(--cond);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.01em;margin-top:6px}
.hero .sub{font-size:14px;margin-top:6px}
.spark{width:100%;height:54px;margin-top:10px;display:block}
.gauge{margin-top:16px;background:var(--panel);border-radius:var(--r-lg);padding:14px 16px}
.g-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.g-top strong{font-size:19px;font-weight:700}
.g-score{font-stretch:var(--cond);font-weight:700;font-size:26px}
.scale{position:relative;height:10px;border-radius:5px;background:var(--panel2);margin:12px 0 4px}
.scale .fill{position:absolute;top:0;bottom:0;border-radius:5px}
.scale .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line)}
.scale-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.comps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.comps div{font-size:12.5px;color:var(--muted)}
.comps b{display:block;font-stretch:var(--cond);font-weight:700;font-size:19px;color:var(--text)}
.comps b.up{color:var(--bull)} .comps b.down{color:var(--bear)}
.drivers{margin:12px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.drivers li{display:grid;grid-template-columns:18px 1fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.drivers li:last-child{border-bottom:0}
.drivers .k{font-size:11.5px;color:var(--muted)}
.card{margin-top:12px;background:var(--panel);border-radius:var(--r-lg);padding:14px 16px}
.card h3{margin:0 0 6px;font-size:15px;font-weight:700}
.card p{margin:0 0 8px}
.card ul{margin:6px 0 0;padding-left:18px}
.card li{margin:4px 0}
.tagline{font-size:12px;color:var(--muted);margin-top:8px}
.cite{font-size:11px;font-weight:700;vertical-align:super;text-decoration:none;color:var(--tape);margin-left:1px}

/* ladder — the signature element */
.ladder{margin-top:10px;background:var(--panel);border-radius:var(--r-lg);overflow:hidden}
.lrow{display:grid;grid-template-columns:4px 1fr;width:100%;text-align:left;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .side{background:var(--line)}
.lrow.res .side{background:var(--bear)} .lrow.sup .side{background:var(--bull)} .lrow.test .side{background:var(--tape)}
.lrow .body{padding:10px 14px 10px 12px;min-width:0}
.lmain{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.lpx{font-stretch:var(--cond);font-weight:700;font-size:18px;min-width:84px}
.lrow.s1 .lpx,.lrow.s2 .lpx{font-weight:550;font-size:16.5px;color:var(--muted)}
.lcodes{grid-column:1 / -1;font-size:12.5px;color:var(--muted);line-height:1.35}
.ldist{text-align:right;font-stretch:var(--cond);font-weight:600;font-size:14px;white-space:nowrap}
.ldist span{display:block;font-stretch:100%;font-weight:400;font-size:11px;color:var(--muted)}
.str{display:inline-flex;gap:2px;margin-right:6px;vertical-align:middle}
.str i{width:5px;height:12px;border-radius:1.5px;background:var(--panel2)}
.lrow.res .str i.on{background:var(--bear)} .lrow.sup .str i.on{background:var(--bull)} .lrow.test .str i.on{background:var(--tape)}
.lmore{display:none;margin-top:8px;font-size:13.5px;line-height:1.45}
.lrow[aria-expanded="true"] .lmore{display:block}
.lmore p{margin:0 0 6px}
.lmore b{font-weight:650}
.tape{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:7px 14px;background:var(--brass-bg)}
.tape hr{border:0;height:2px;background:var(--tape);margin:0}
.tape span{font-stretch:var(--cond);font-weight:800;font-size:17px;color:var(--tape)}
.tv{display:inline-block;margin-top:14px;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* settings */
.form label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.form input,.form select{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;background:var(--text);color:var(--bg);font-weight:650;font-size:14.5px;margin-top:12px}
.btn.sec{background:var(--panel2);color:var(--text)}
.feeds{font-size:13px}
.feeds div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
footer.disc{font-size:12px;color:var(--muted);margin:22px 0 10px;line-height:1.5}

/* ---------- desktop globe ("light-string") layout ---------- */
.hud-left{display:contents}
#holo,.holo-ui,.holo-tip,.layout-btn{display:none}
@media (min-width:1024px) and (hover:hover) and (pointer:fine){ body:not(.holo) .layout-btn{display:grid} }
body.holo{
  --bg:#0B1020; --panel:rgba(255,255,255,.04); --panel2:rgba(255,236,206,.08); --line:rgba(255,190,120,.14);
  --text:#F6EDE0; --muted:#ABA196; --bull:#4CDE80; --bear:#FF5A46; --brass:#FFC45C; --tape:#FFC45C;
  --bull-bg:rgba(76,222,128,.14); --bear-bg:rgba(255,90,70,.14); --brass-bg:rgba(255,196,92,.12);
  --glass:rgba(9,13,24,.86); --edge:rgba(255,190,120,.18);
  color-scheme:dark; overflow:hidden; padding-bottom:0; background:#060911;
}
body.holo #holo{display:block;position:fixed;inset:0;z-index:0;cursor:grab;touch-action:none;
  background:radial-gradient(ellipse 70% 85% at 62% 48%,#19223D 0%,#0C1222 55%,#05080F 100%)}
body.holo .hud-left{display:flex;flex-direction:column;position:fixed;left:16px;top:16px;bottom:16px;width:400px;z-index:10;
  overflow-y:auto;overflow-x:hidden;border-radius:18px;background:var(--glass);border:1px solid var(--edge);
  box-shadow:0 24px 70px rgba(0,0,0,.5);scrollbar-width:thin}
body.holo header.top{background:rgba(9,13,24,.88);padding-top:0;border-bottom-color:var(--line)}
body.holo main{flex:1 0 auto;width:100%;padding-bottom:16px}
body.holo nav.tabs{position:sticky;bottom:0;background:rgba(9,13,24,.94);padding-bottom:0;border-top-color:var(--line)}
body.holo .sheet{left:auto;right:16px;top:16px;bottom:16px;width:440px;border-radius:18px;background:var(--glass);border:1px solid var(--edge);
  transform:translateX(calc(100% + 40px));z-index:20;padding-bottom:20px;box-shadow:0 24px 70px rgba(0,0,0,.5)}
body.holo .sheet.open{transform:none}
body.holo .sheet header{background:rgba(9,13,24,.9);padding-top:0}
body.holo .breaking{background:var(--panel)}
body.holo .holo-ui{display:block}
body.holo .holo-tip:not([hidden]){display:block}
.holo-tools{position:fixed;top:16px;right:16px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 760px);transition:right .26s}
.holo-tools .chip{background:rgba(9,13,24,.82);border-color:var(--edge);color:var(--text)}
.holo-tools .chip[aria-pressed="false"]{color:var(--muted)}
.holo-tools .chip[aria-pressed="true"]{background:rgba(255,196,92,.16);border-color:rgba(255,196,92,.5);color:#FFE3B0}
.holo-legend{position:fixed;left:432px;top:16px;z-index:5;width:270px;font-size:12.5px;line-height:1.5;color:var(--muted);padding:12px 14px;border-radius:14px;
  background:rgba(9,13,24,.78);border:1px solid var(--edge)}
.holo-legend div{display:flex;align-items:center;color:var(--text)}
.holo-legend i{width:9px;height:9px;border-radius:50%;margin-right:9px;flex:none;box-shadow:0 0 9px 2px currentColor}
.holo-legend p{margin:8px 0 0}
.holo-ticker{position:fixed;left:432px;right:16px;bottom:16px;z-index:5;height:42px;overflow:hidden;white-space:nowrap;display:flex;align-items:center;border-radius:14px;
  background:rgba(9,13,24,.82);border:1px solid var(--edge);transition:right .26s;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.tk{display:inline-flex;gap:44px;padding-left:24px}
.tk.run{animation:crawl 60s linear infinite}
.holo-ticker:hover .tk{animation-play-state:paused}
@keyframes crawl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ti{text-decoration:none;font-size:13.5px;color:var(--text)}
.ti .m,.holo-tip .m{color:var(--muted)}
.ti .up,.holo-tip .up{color:var(--bull)} .ti .down,.holo-tip .down{color:var(--bear)}
.bulb{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FFC45C;box-shadow:0 0 10px 3px rgba(255,196,92,.75);margin-right:9px;vertical-align:1px;animation:blink 1.1s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25;box-shadow:none}}
body.holo.sheet-open .holo-tools,body.holo.sheet-open .holo-ticker{right:472px}
.holo-tip{position:fixed;z-index:30;max-width:330px;padding:10px 13px;border-radius:12px;background:rgba(10,13,24,.94);border:1px solid rgba(255,190,120,.28);
  font-size:13px;line-height:1.5;color:var(--text);pointer-events:none;box-shadow:0 12px 34px rgba(0,0,0,.55)}
.holo-tip b{font-weight:700}
.holo-tip .big{font-stretch:72%;font-weight:700;font-size:21px}
@media (prefers-reduced-motion: reduce){.bulb{animation:none}.tk.run{animation:none}}
@media (max-width:1280px){.holo-legend{display:none}}
body.holo header.top,body.holo nav.tabs,body.holo .sheet header{-webkit-backdrop-filter:none;backdrop-filter:none}
body.holo.sheet-open .holo-legend{display:none}
body.holo.sheet-open .holo-tools{max-width:calc(100vw - 920px)}
body.holo.sheet-open .holo-tools .chip[data-layer]{display:none}
</style>
</head>
<body>
<div class="hud-left" id="hud">
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">Futures Pulse<small id="mkt">Loading…</small></div>
      <div class="spacer"></div>
      <span class="fresh" id="fresh"><i></i><span>—</span></span>
      <button class="iconbtn layout-btn" data-layout="holo" aria-label="Switch to globe view" title="Globe view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="3.5" ry="8"/><path d="M4 12h16"/></svg>
      </button>
      <button class="iconbtn" id="refresh" aria-label="Reload data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
      <button class="iconbtn" id="gear" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="macro" id="macro"></div>
  </div>
</header>

<main class="wrap" id="main" aria-live="polite"></main>

<nav class="tabs" aria-label="Sections">
  <div class="wrap">
    <button data-tab="board" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="1.6" fill="currentColor"/><circle cx="15" cy="12" r="1.6" fill="currentColor"/><circle cx="7" cy="18" r="1.6" fill="currentColor"/></svg>Markets</button>
    <button data-tab="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="14" height="16" rx="2"/><path d="M17 8h3v10a2 2 0 0 1-2 2M7 8h6M7 12h6M7 16h4"/></svg>News<span class="badge" id="nb" hidden></span></button>
    <button data-tab="events"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
    <button data-tab="alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Alerts<span class="badge" id="ab" hidden></span></button>
  </div>
</nav>
</div>

<canvas id="holo" role="img" aria-label="Globe of tracked markets, headlines and scheduled releases. The panel on the left lists the same information."></canvas>
<div class="holo-ui" id="holoUi"></div>
<div class="holo-tip" id="holoTip" hidden></div>

<section class="sheet" id="sheet" aria-hidden="true"></section>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
// ---------- storage (best effort) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('fp.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('fp.' + k, JSON.stringify(v)); } catch {} },
};
const S = {
  data: null, tab: 'board', detail: null,
  lf: store.get('ladderFilter', 'key'), nf: 'all', ni: 'all',
  open: new Set(), loading: false, seenAlerts: store.get('seenAlerts', ''), seenNews: store.get('seenNews', ''),
};
const theme = store.get('theme', 'auto');
if (theme !== 'auto') document.documentElement.dataset.theme = theme;

// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => (/^https?:\/\//i.test(u || '') ? u : '#');
const fmt = (x, d = 2) => (x === null || x === undefined || Number.isNaN(+x)) ? '—'
  : Number(x).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const sign = (x, d = 2) => (x > 0 ? '+' : x < 0 ? '−' : '') + fmt(Math.abs(x), d);
const cls = (x) => (x > 0 ? 'up' : x < 0 ? 'down' : 'muted');
const ago = (iso) => {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (!Number.isFinite(m)) return '';
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  const h = Math.floor(m / 60);
  return h < 24 ? `${h}h ${m % 60 ? (m % 60) + 'm ' : ''}ago` : `${Math.floor(h / 24)}d ago`;
};
const until = (iso) => {
  const m = Math.round((Date.parse(iso) - Date.now()) / 60000);
  if (m < 0) return m > -60 ? `${-m} min ago` : 'earlier';
  if (m < 60) return `in ${m} min`;
  const h = Math.floor(m / 60);
  return `in ${h}h ${m % 60}m`;
};
const etTime = (iso) => new Date(iso).toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' });
const etDay = (iso) => new Date(iso).toLocaleDateString('en-US', { timeZone: 'America/New_York', weekday: 'long', month: 'short', day: 'numeric' });
const pillCls = (s) => (s >= 15 ? 'bull' : s <= -15 ? 'bear' : 'flat');
const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 3200); };

// ---------- data ----------
async function load(quiet) {
  if (S.loading) return;
  S.loading = true;
  $('#refresh').classList.add('spin');
  try {
    const r = await fetch('./data/market.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    const changed = !S.data || S.data.generatedAt !== d.generatedAt;
    S.data = d;
    if (changed || !quiet) render();
    else renderHeader();
  } catch (e) {
    if (!S.data) $('#main').innerHTML = `<div class="note bad">Couldn’t load market data (${esc(e.message)}). If you just set this up, the first update takes about two minutes after the workflow starts.</div>`;
    else if (!quiet) toast('Offline — showing the last data received');
  } finally {
    S.loading = false;
    $('#refresh').classList.remove('spin');
  }
}

// ---------- header ----------
function renderHeader() {
  const d = S.data; if (!d) return;
  const age = (Date.now() - Date.parse(d.generatedAt)) / 60000;
  const f = $('#fresh');
  f.className = 'fresh' + (age > 40 ? ' stale' : age > 15 ? ' aging' : '');
  f.querySelector('span').textContent = ago(d.generatedAt);
  $('#mkt').textContent = `${d.market?.label || ''}, ${etTime(d.generatedAt)} ET`;
  $('#macro').innerHTML = (d.macro || []).filter((m) => !m.error).map((m) => {
    const isY = m.id === 'US10Y';
    const ch = isY ? `${sign(m.change * 100, 1)} bp` : `${sign(m.changePct, 2)}%`;
    return `<div>${esc(m.id === 'US10Y' ? '10Y' : m.id)}<b>${fmt(m.price, isY ? 3 : 2)}${isY ? '%' : ''}</b><span class="${cls(m.change)}">${ch}</span></div>`;
  }).join('');
  const newAlerts = (d.alerts || []).filter((a) => a.time > S.seenAlerts).length;
  const ab = $('#ab'); ab.hidden = !newAlerts; ab.textContent = newAlerts > 9 ? '9+' : newAlerts;
  const nb = $('#nb'); const br = (d.news || []).filter((n) => n.kind === 'breaking' && n.publishedAt > S.seenNews).length;
  nb.hidden = !br; nb.textContent = br;
}

// ---------- views ----------
function render() {
  renderHeader();
  const d = S.data; if (!d) return;
  if (document.body.classList.contains('holo') && window.FPHolo && S.holoGen !== d.generatedAt) { S.holoGen = d.generatedAt; window.FPHolo.setData(d); }
  document.querySelectorAll('nav.tabs button').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false'));
  const v = { board: viewBoard, news: viewNews, events: viewEvents, alerts: viewAlerts }[S.tab] || viewBoard;
  $('#main').innerHTML = banners() + v(d) + disclaimer(d);
  if (S.detail) renderDetail();
}

function banners() {
  const d = S.data; let h = '';
  if (d.sample) h += `<div class="note">Sample data. Real prices, levels and headlines appear after the first GitHub Actions run (about two minutes after you enable it).</div>`;
  const age = (Date.now() - Date.parse(d.generatedAt)) / 60000;
  if (!d.sample && age > 40 && d.market?.open) h += `<div class="note bad">This data is ${Math.round(age)} minutes old. GitHub may be delaying the scheduled run; open Settings to start one now.</div>`;
  if (S.tab === 'board') {
    const brk = (d.news || []).filter((n) => n.kind === 'breaking').slice(0, 2);
    for (const n of brk) h += `<a class="breaking" href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener"><strong><span class="dot"></span> ${esc(n.title)}</strong><div class="meta">${esc(n.source)}${n.sources.length > 1 ? `, ${n.sources.length} outlets` : ''}, ${ago(n.publishedAt)}</div>${fxChips(n, 5)}</a>`;
  }
  return h;
}
const fxChips = (n, max = 8, focus = null) => {
  const e = Object.entries(n.effects || {}).sort((a, b) => (b[0] === focus) - (a[0] === focus) || Math.abs(b[1]) - Math.abs(a[1]));
  if (!e.length) return '';
  const more = e.length > max ? `<span style="background:var(--panel2)">+${e.length - max}</span>` : '';
  return `<div class="fx">${e.slice(0, max).map(([k, v]) => `<span class="${v > 0 ? 'u' : 'd'}">${esc(k)} ${v > 0 ? '▲' : '▼'}</span>`).join('')}${more}</div>`;
};

function viewBoard(d) {
  const rows = d.instruments.map((i) => {
    if (i.error && !i.price) return `<div class="row"><div class="r1"><span class="sym">${esc(i.id)}</span><span class="muted">${esc(i.name)}</span></div><div class="err">No price data this run: ${esc(i.error)}</div></div>`;
    const s = i.sentiment, dec = i.decimals;
    const sup = i.nearest?.support, res = i.nearest?.resistance;
    let pos = 50;
    if (sup && res && res.price > sup.price) pos = Math.max(0, Math.min(100, ((i.price - sup.price) / (res.price - sup.price)) * 100));
    return `<button class="row" data-open="${esc(i.id)}" aria-label="${esc(i.id)} details">
      <div class="r1"><span class="sym">${esc(i.id)}</span><span class="px">${fmt(i.price, dec)}</span><span class="chg ${cls(i.change)}">${i.changePct == null ? '' : sign(i.changePct, 2) + '%'}</span></div>
      <div class="r2"><span class="name">${esc(i.name)}${i.stale ? ' (last good data)' : ''}</span><span class="pill ${pillCls(s.score)}">${esc(s.label)} ${sign(s.score, 0)}</span></div>
      <div class="rail">
        <div class="lv">${sup ? fmt(sup.price, dec) : '—'}<span>${sup ? esc(sup.codes.slice(0, 2).join(' + ')) : 'support'}</span></div>
        <div class="track" aria-hidden="true"><i style="left:${pos.toFixed(1)}%"></i></div>
        <div class="lv r">${res ? fmt(res.price, dec) : '—'}<span>${res ? esc(res.codes.slice(0, 2).join(' + ')) : 'resistance'}</span></div>
      </div>
    </button>`;
  }).join('');
  return `<div class="board">${rows}</div>`;
}

function newsItem(n, focus) {

  const imp = { high: 'High impact', med: 'Medium impact', low: 'Low impact' }[n.impact];
  return `<div class="item">
    <a class="t" href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener">${n.kind === 'breaking' ? '<span class="dot"></span> ' : ''}${esc(n.title)}</a>
    <div class="meta"><span class="imp ${n.impact}">${imp}</span><span>${esc(n.source)}${n.sources.length > 1 ? ` + ${n.sources.length - 1} more` : ''}</span><span>${ago(n.publishedAt)}</span>${n.official ? '<span>Official source</span>' : ''}${n.kind === 'catalyst' ? '<span>Upcoming catalyst</span>' : ''}</div>
    ${fxChips(n, 8, focus && focus !== 'all' ? focus : null)}
    ${n.rules?.length ? `<div class="why">Why it matters (analysis): ${esc(n.rules.join(', '))}</div>` : ''}
  </div>`;
}

function viewNews(d) {
  S.seenNews = d.generatedAt; store.set('seenNews', S.seenNews);
  const filters = [['all', 'All'], ['breaking', 'Breaking'], ['high', 'High impact'], ['catalyst', 'Upcoming catalysts'], ['official', 'Official']];
  let list = d.news || [];
  if (S.nf === 'breaking') list = list.filter((n) => n.kind === 'breaking');
  if (S.nf === 'high') list = list.filter((n) => n.impact === 'high');
  if (S.nf === 'catalyst') list = list.filter((n) => n.kind === 'catalyst');
  if (S.nf === 'official') list = list.filter((n) => n.official);
  if (S.ni !== 'all') list = list.filter((n) => n.effects?.[S.ni] || n.relevant?.includes(S.ni));
  const insts = d.instruments.map((i) => i.id);
  return `<div class="chips" role="group" aria-label="News filter">${filters.map(([k, l]) => `<button class="chip" data-nf="${k}" aria-pressed="${S.nf === k}">${l}</button>`).join('')}</div>
  <div class="chips" role="group" aria-label="Market filter"><button class="chip" data-ni="all" aria-pressed="${S.ni === 'all'}">Every market</button>${insts.map((k) => `<button class="chip" data-ni="${k}" aria-pressed="${S.ni === k}">${k}</button>`).join('')}</div>
  <div class="list">${list.length ? list.slice(0, 120).map((n) => newsItem(n, S.ni)).join('') : '<div class="empty">No headlines match this filter right now.</div>'}</div>`;
}

function viewEvents(d) {
  const ev = (d.calendar || []).filter((e) => Date.parse(e.time) > Date.now() - 3 * 3600e3);
  if (!ev.length) return `<div class="list" style="margin-top:12px"><div class="empty">No medium or high impact releases scheduled in the feed. The calendar refreshes hourly.</div></div>`;
  let h = '', day = '';
  for (const e of ev) {
    const dd = etDay(e.time);
    if (dd !== day) { h += `<div class="dayhead">${esc(dd)}</div>`; day = dd; }
    const past = Date.parse(e.time) < Date.now();
    h += `<div class="item ev"${past ? ' style="opacity:.6"' : ''}><div class="tm">${etTime(e.time)}<span>${until(e.time)}</span></div><div>
      <div style="font-weight:600">${esc(e.country)} ${esc(e.title)}</div>
      <div class="meta"><span class="imp ${e.impact === 'High' ? 'high' : 'med'}">${esc(e.impact)} impact</span>${e.forecast ? `<span>Forecast ${esc(e.forecast)}</span>` : ''}${e.previous ? `<span>Previous ${esc(e.previous)}</span>` : ''}${e.actual ? `<span>Actual ${esc(e.actual)}</span>` : ''}</div>
      ${e.instruments?.length ? `<div class="fx">${e.instruments.map((k) => `<span style="background:var(--panel2)">${esc(k)}</span>`).join('')}</div>` : ''}
    </div></div>`;
  }
  return `<h2 class="sec">Scheduled releases (ET)</h2><div class="list">${h}</div>`;
}

function viewAlerts(d) {
  const list = d.alerts || [];
  S.seenAlerts = list[0]?.time || S.seenAlerts; store.set('seenAlerts', S.seenAlerts);
  const name = { cross: 'Level cross', sentiment: 'Sentiment shift', news: 'Headline', event: 'Upcoming release' };
  if (!list.length) return `<div class="list" style="margin-top:12px"><div class="empty">Nothing yet. Level crosses, sentiment shifts, high impact headlines and upcoming releases show up here as each update runs.</div></div>`;
  return `<h2 class="sec">Changes between updates</h2><div class="list">${list.map((a) => `<div class="item">
    <div style="font-weight:560">${a.url ? `<a class="t" href="${esc(safeUrl(a.url))}" target="_blank" rel="noopener">${esc(a.text)}</a>` : esc(a.text)}</div>
    <div class="meta"><span class="${a.direction === 'up' ? 'up' : a.direction === 'down' ? 'down' : ''}">${esc(name[a.type] || a.type)}</span><span>${ago(a.time)}</span>${a.instrument ? `<button class="chip" style="padding:2px 9px" data-open="${esc(a.instrument)}">Open ${esc(a.instrument)}</button>` : ''}</div>
  </div>`).join('')}</div>`;
}

function disclaimer(d) {
  return `<footer class="disc">${esc(d.priceSource || '')}. Levels, sentiment and “why it matters” notes are computed analysis, not financial advice. Headlines link to their original sources.</footer>`;
}

// ---------- detail ----------
const LF = [['key', 'Key levels'], ['all', 'All'], ['hl', 'Highs / lows'], ['oc', 'Opens / closes'], ['pivot', 'Pivots'], ['vol', 'Volume / VWAP'], ['swing', 'Swing zones'], ['round', 'Round numbers'], ['range', 'ATR range']];

function sparkSvg(arr, up) {
  if (!arr?.length) return '';
  const w = 600, h = 54, lo = Math.min(...arr), hi = Math.max(...arr), r = hi - lo || 1;
  const pts = arr.map((v, i) => `${((i / (arr.length - 1 || 1)) * w).toFixed(1)},${(h - 4 - ((v - lo) / r) * (h - 8)).toFixed(1)}`);
  const lx = pts[pts.length - 1].split(',');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="${up ? 'var(--bull)' : 'var(--bear)'}" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts.join(' ')}"/><circle cx="${lx[0]}" cy="${lx[1]}" r="3.5" fill="var(--tape)"/></svg>`;
}

function citeLinks(text, d) {
  const byId = Object.fromEntries((d.news || []).map((n) => [n.id, n]));
  let k = 0;
  return esc(text).replace(/\[(n[a-z0-9]+)\]/g, (m, id) => {
    const n = byId[id]; k++;
    return n ? `<a class="cite" href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener" title="${esc(n.title)}">${k}</a>` : '';
  });
}

function renderDetail() {
  const d = S.data, i = d.instruments.find((x) => x.id === S.detail);
  const sh = $('#sheet');
  if (!i) { closeDetail(); return; }
  const dec = i.decimals, s = i.sentiment;
  const byId = Object.fromEntries((d.news || []).map((n) => [n.id, n]));
  const evById = Object.fromEntries((d.calendar || []).map((e) => [e.id, e]));

  let lv = i.levels || [];
  if (S.lf === 'key') lv = lv.filter((l) => l.strength >= 3 || l.role === 'testing');
  else if (S.lf !== 'all') lv = lv.filter((l) => l.cats.includes(S.lf));
  const aiNote = (l) => (i.ai?.levels || []).find((a) => Math.abs(a.price - l.price) <= (i.atr || 1) * 0.06);
  let tapeDone = false;
  const rows = [];
  for (const l of lv) {
    if (!tapeDone && l.price < i.price) { rows.push(tapeRow(i)); tapeDone = true; }
    const role = l.role === 'resistance' ? 'res' : l.role === 'support' ? 'sup' : 'test';
    const key = `${i.id}:${l.price}`;
    const note = aiNote(l);
    const tested = l.tests && (l.tests.held || l.tests.broke) ? `<p><b>Recent behavior:</b> held ${l.tests.held}×, broke ${l.tests.broke}× in the last 3 sessions${l.tests.lastTest ? `, last test ${ago(new Date(l.tests.lastTest).toISOString())}` : ''}.</p>` : '';
    rows.push(`<button class="lrow ${role} s${l.strength}" data-lv="${esc(key)}" aria-expanded="${S.open.has(key)}">
      <span class="side"></span>
      <span class="body">
        <span class="lmain">
          <span class="lpx">${fmt(l.price, dec)}</span>
          <span class="str" aria-label="strength ${l.strength} of 5">${[1, 2, 3, 4, 5].map((k) => `<i class="${k <= l.strength ? 'on' : ''}"></i>`).join('')}</span>
          <span class="ldist">${sign(l.dist, dec)}<span>${Math.abs(l.distAtr).toFixed(2)} ATR, $${l.dollars.toLocaleString('en-US')}</span></span>
          <span class="lcodes">${esc(l.labels.slice(0, 4).join(' + '))}${l.labels.length > 4 ? ` + ${l.labels.length - 4} more` : ''}</span>
        </span>
        <span class="lmore">
          <p><b>${l.role === 'testing' ? 'Being tested now' : l.role === 'resistance' ? 'Resistance' : 'Support'}:</b> ${l.confluence > 1 ? `${l.confluence} reference levels stack here, which is why it rates ${l.strength} of 5.` : `One reference level, rated ${l.strength} of 5.`}${l.flipped ? ' ' + esc(l.flipped) : ''}</p>
          ${tested}
          ${l.context ? `<p><b>Context (analysis):</b> ${esc(l.context)}</p>` : ''}
          ${note ? `<p><b>AI note:</b> ${citeLinks(note.note, d)}</p>` : ''}
          <p class="muted">Distance in dollars is per one micro contract ($${fmt(i.pointValue, i.pointValue < 1 ? 2 : 0)} per point).</p>
        </span>
      </span>
    </button>`);
  }
  if (!tapeDone) rows.push(tapeRow(i));

  const comp = s.components;
  const fill = s.score >= 0 ? `left:50%;width:${s.score / 2}%;background:var(--bull)` : `left:${50 + s.score / 2}%;width:${-s.score / 2}%;background:var(--bear)`;
  const drivers = (s.drivers || []).slice(0, 7).map((x) => `<li><span class="${x.effect > 0 ? 'up' : 'down'}">${x.effect > 0 ? '▲' : '▼'}</span><span>${x.newsId && byId[x.newsId] ? `<a href="${esc(safeUrl(byId[x.newsId].url))}" target="_blank" rel="noopener">${esc(x.text)}</a>` : esc(x.text)} <span class="k">${{ technical: 'Technical', news: 'News', macro: 'Macro' }[x.kind]}</span></span></li>`).join('');
  const nar = i.narrative || {};
  const heads = (i.headlineIds || []).map((id) => byId[id]).filter(Boolean).slice(0, 8);
  const evs = (i.eventIds || []).map((id) => evById[id]).filter(Boolean);
  const tv = `https://www.tradingview.com/chart/?symbol=${encodeURIComponent(i.id + '1!')}`;

  sh.innerHTML = `
  <header><div class="wrap"><div class="bar">
    <button class="back" data-close aria-label="Back to markets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>Markets</button>
    <div class="spacer"></div><span class="muted" style="font-size:13px">${i.asOf ? 'Quote ' + etTime(i.asOf) + ' ET' : ''}</span>
  </div></div></header>
  <div class="wrap">
    <div class="hero">
      <div class="r1"><span class="sym">${esc(i.id)}</span><span class="muted" style="font-size:14px">${esc(i.name)}</span></div>
      <div class="big">${fmt(i.price, dec)}</div>
      <div class="sub"><span class="${cls(i.change)}">${i.change == null ? '' : `${sign(i.change, dec)} (${sign(i.changePct, 2)}%)`}</span> <span class="muted">vs prior close${i.atr ? `, ATR ${fmt(i.atr, dec)}${i.rangeUsed != null ? `, ${Math.round(i.rangeUsed * 100)}% used today` : ''}` : ''}</span></div>
      ${sparkSvg(i.spark, (i.change || 0) >= 0)}
    </div>

    <div class="gauge">
      <div class="g-top"><strong class="${s.score >= 15 ? 'up' : s.score <= -15 ? 'down' : ''}">${esc(s.label)}</strong><span class="g-score ${cls(s.score)}">${sign(s.score, 0)}</span></div>
      <div class="scale" role="img" aria-label="Sentiment ${s.score} on a scale from minus 100 to plus 100"><span class="fill" style="${fill}"></span><span class="mid"></span></div>
      <div class="scale-l"><span>Bearish −100</span><span>${esc(s.confidence)} confidence</span><span>+100 Bullish</span></div>
      <div class="comps"><div>Technical<b class="${cls(comp.technical)}">${sign(comp.technical, 0)}</b></div><div>News (${s.newsCount})<b class="${cls(comp.news)}">${sign(comp.news, 0)}</b></div><div>Macro<b class="${cls(comp.macro)}">${sign(comp.macro, 0)}</b></div></div>
      <ul class="drivers">${drivers}</ul>
    </div>

    <div class="card">
      <h3>The read</h3>
      <p>${esc(nar.summary || '')}</p>
      ${nar.playbook?.length ? `<ul>${nar.playbook.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
      ${nar.eventRisk?.length ? `<p style="margin-top:10px"><b>Event risk</b></p><ul>${nar.eventRisk.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
      <div class="tagline">Computed from levels, headlines and macro data in this update. Analysis, not advice.</div>
    </div>

    ${i.ai ? `<div class="card"><h3>AI analysis</h3>
      <p>${citeLinks(i.ai.summary || '', d)}</p>
      <ul>${i.ai.bull ? `<li><span class="up">Bull case:</span> ${citeLinks(i.ai.bull, d)}</li>` : ''}${i.ai.bear ? `<li><span class="down">Bear case:</span> ${citeLinks(i.ai.bear, d)}</li>` : ''}${i.ai.watch ? `<li>Watch: ${citeLinks(i.ai.watch, d)}</li>` : ''}</ul>
      <div class="tagline">Written by ${esc(d.ai?.model || 'Claude')} at ${d.ai?.generatedAt ? etTime(d.ai.generatedAt) + ' ET' : ''} from this update’s data only; numbered links open the cited headline.</div></div>` : ''}

    <h2 class="sec">Support and resistance</h2>
    <div class="chips" role="group" aria-label="Level filter" style="padding-top:0">${LF.map(([k, l]) => `<button class="chip" data-lf="${k}" aria-pressed="${S.lf === k}">${l}</button>`).join('')}</div>
    <div class="ladder">${rows.join('')}</div>
    <div class="tagline">Tap a level for what it is, how price has treated it, and the news context. Bars show strength (confluence of reference levels).</div>

    ${evs.length ? `<h2 class="sec">Releases that can move ${esc(i.id)}</h2><div class="list">${evs.map((e) => `<div class="item ev"><div class="tm">${etTime(e.time)}<span>${until(e.time)}</span></div><div><div style="font-weight:600">${esc(e.country)} ${esc(e.title)}</div><div class="meta"><span class="imp ${e.impact === 'High' ? 'high' : 'med'}">${esc(e.impact)} impact</span>${e.forecast ? `<span>Forecast ${esc(e.forecast)}</span>` : ''}${e.previous ? `<span>Previous ${esc(e.previous)}</span>` : ''}</div></div></div>`).join('')}</div>` : ''}

    <h2 class="sec">Headlines for ${esc(i.id)}</h2>
    <div class="list">${heads.length ? heads.map((n) => newsItem(n, i.id)).join('') : '<div class="empty">No scored headlines for this market in the last 36 hours.</div>'}</div>

    <a class="tv" href="${tv}" target="_blank" rel="noopener">Open ${esc(i.id)} chart in TradingView</a>
    ${i.dataSymbol ? `<div class="tagline">Prices from ${esc(i.dataSymbol)} on Yahoo Finance; micro and full-size contracts quote the same price.</div>` : ''}
  </div>`;
}

function tapeRow(i) {
  return `<div class="tape" aria-label="Current price"><hr><span>${fmt(i.price, i.decimals)}</span><hr></div>`;
}

function openDetail(id, push = true) {
  S.detail = id; S.open.clear();
  renderDetail();
  const sh = $('#sheet');
  sh.classList.add('open'); sh.setAttribute('aria-hidden', 'false'); sh.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  document.body.classList.add('sheet-open');
  window.FPHolo?.select(id);
  if (push) history.pushState({ d: id }, '', '#' + id);
}
function closeDetail(pop) {
  S.detail = null;
  const sh = $('#sheet');
  sh.classList.remove('open'); sh.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  document.body.classList.remove('sheet-open');
  window.FPHolo?.select(null);
  if (!pop && location.hash) history.back();
}

// ---------- settings ----------
const CODES = [
  ['PDH / PDL / PDC', 'Prior day high, low, day-session close'],
  ['ONH / ONL', 'Overnight (Globex) high and low'],
  ['GO / NYO', 'Globex open (6pm ET), day-session open'],
  ['IBH / IBL', 'Initial balance: first-hour high and low'],
  ['HOD / LOD', 'Session high and low so far'],
  ['P, R1–R3, S1–S3', 'Daily floor pivots'],
  ['H3 H4 / L3 L4', 'Camarilla pivots'],
  ['PWH / PWL / PWC', 'Prior week high, low, close'],
  ['WO / WP', 'Weekly open, weekly pivot'],
  ['PMH / PML / PMC', 'Prior month high, low, close'],
  ['MO', 'Monthly open'],
  ['52WH / 52WL', '52-week high and low'],
  ['VWAP ±σ', 'Session VWAP and its bands'],
  ['PD POC / VAH / VAL', 'Prior day volume profile'],
  ['5D POC / VAH / VAL', '5-day volume profile'],
  ['D-SW×n / H-SW×n', 'Daily or hourly swing zone, n turning points'],
  ['RN / rn', 'Major or minor round number'],
  ['ATR↑ / ATR↓', 'Typical daily range from today’s low or high'],
];
function openSettings() {
  const d = S.data || {};
  const sh = $('#sheet');
  S.detail = null;
  const repo = d.repo || '';
  const feeds = (d.feeds || []).map((f) => `<div><span>${esc(f.name)}</span><span class="${f.ok ? 'up' : 'down'}">${f.ok ? `${f.count} ok` : 'failed'}</span></div>`).join('');
  sh.innerHTML = `<header><div class="wrap"><div class="bar"><button class="back" data-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>Done</button></div></div></header>
  <div class="wrap form">
    <h2 class="sec">Appearance</h2>
    <select id="themeSel"><option value="auto">Match my phone</option><option value="dark">Dark</option><option value="light">Light</option></select>

    <h2 class="sec">Run an update now</h2>
    <p class="muted" style="margin:0;font-size:14px">GitHub runs updates about every 10 minutes and sometimes runs late. With a token you can start one from here. Create a fine-grained token limited to ${repo ? `<b>${esc(repo)}</b>` : 'this repository'} with <b>Actions: Read and write</b>. It is stored only on this phone.</p>
    <label for="tok">GitHub token</label><input id="tok" type="password" autocomplete="off" placeholder="github_pat_…" value="${esc(store.get('ghToken', ''))}">
    <label for="repo">Repository</label><input id="repo" value="${esc(store.get('ghRepo', repo))}" placeholder="owner/repo">
    <button class="btn" id="runNow">Start update</button> <button class="btn sec" id="forget">Remove token</button>

    <h2 class="sec">AI analysis</h2>
    <p class="muted" style="margin:0;font-size:14px">${d.ai?.enabled ? `On (${esc(d.ai.model)}). Last written ${d.ai.generatedAt ? ago(d.ai.generatedAt) : 'not yet'}.${d.ai.error ? ` Last error: ${esc(d.ai.error)}` : ''}` : 'Off. Add an ANTHROPIC_API_KEY repository secret to get written analysis for each market.'}</p>

    <h2 class="sec">Level codes</h2>
    <div class="feeds">${CODES.map(([c, t]) => `<div><span class="num" style="min-width:92px">${esc(c)}</span><span class="muted" style="text-align:right">${esc(t)}</span></div>`).join('')}</div>

    <h2 class="sec">Feed health (this update)</h2>
    <div class="feeds">${feeds || '<p class="muted">No data yet.</p>'}</div>
    <footer class="disc">Updated ${d.generatedAt ? esc(new Date(d.generatedAt).toLocaleString()) : '—'}. ${esc(d.priceSource || '')}.</footer>
  </div>`;
  $('#themeSel').value = store.get('theme', 'auto');
  sh.classList.add('open'); sh.setAttribute('aria-hidden', 'false'); sh.scrollTop = 0;
  document.body.classList.add('sheet-open');
  document.body.style.overflow = 'hidden';
  history.pushState({ s: 1 }, '', '#settings');
}

async function runNow() {
  const tok = $('#tok').value.trim(), repo = $('#repo').value.trim();
  if (!tok || !/^[\w.-]+\/[\w.-]+$/.test(repo)) { toast('Add a token and the repository as owner/repo'); return; }
  store.set('ghToken', tok); store.set('ghRepo', repo);
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/actions/workflows/update.yml/dispatches`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${tok}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
      body: JSON.stringify({ ref: S.data?.ref || 'main' }),
    });
    if (r.status === 204) {
      toast('Update started. New data usually lands in 1–3 minutes.');
      const before = S.data?.generatedAt; let n = 0;
      const iv = setInterval(async () => { n++; await load(true); if (S.data?.generatedAt !== before || n > 12) { clearInterval(iv); if (S.data?.generatedAt !== before) toast('New data loaded'); } }, 20000);
    } else {
      const j = await r.json().catch(() => ({}));
      toast(`GitHub said ${r.status}: ${j.message || 'request refused'}`);
    }
  } catch (e) { toast('Could not reach GitHub: ' + e.message); }
}

// ---------- events ----------
document.addEventListener('click', (e) => {
  const t = e.target.closest('button,[data-close]');
  if (!t) return;
  if (t.dataset.open) { openDetail(t.dataset.open); return; }
  if (t.hasAttribute('data-close')) { closeDetail(); return; }
  if (t.dataset.tab) { S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.nf) { S.nf = t.dataset.nf; render(); return; }
  if (t.dataset.ni) { S.ni = t.dataset.ni; render(); return; }
  if (t.dataset.lf) { S.lf = t.dataset.lf; store.set('ladderFilter', S.lf); renderDetail(); return; }
  if (t.dataset.lv) {
    const k = t.dataset.lv; S.open.has(k) ? S.open.delete(k) : S.open.add(k);
    t.setAttribute('aria-expanded', S.open.has(k)); return;
  }
  if (t.dataset.layout) { store.set('layout', t.dataset.layout); applyLayout(); return; }
  if (t.id === 'refresh') { load(); return; }
  if (t.id === 'gear') { openSettings(); return; }
  if (t.id === 'runNow') { runNow(); return; }
  if (t.id === 'forget') { store.set('ghToken', ''); $('#tok').value = ''; toast('Token removed from this phone'); return; }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'themeSel') {
    const v = e.target.value; store.set('theme', v);
    if (v === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
  }
});
window.addEventListener('popstate', () => {
  const h = location.hash.slice(1);
  if (!h) closeDetail(true);
  else if (S.data?.instruments.some((i) => i.id === h)) openDetail(h, false);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
setInterval(() => { if (!document.hidden) load(true); }, 60000);
setInterval(() => { if (!document.hidden) renderHeader(); }, 30000);

// ---------- desktop globe layout ----------
const mqWide = matchMedia('(min-width: 1024px) and (hover: hover) and (pointer: fine)');
function applyLayout() {
  const on = mqWide.matches && store.get('layout', 'holo') === 'holo';
  document.body.classList.toggle('holo', on);
  if (window.FPHolo) { window.FPHolo.enable(on); if (on && S.data) { S.holoGen = S.data.generatedAt; window.FPHolo.setData(S.data); } }
}
mqWide.addEventListener?.('change', applyLayout);
window.FP = {
  get data() { return S.data; }, store, esc, fmt, sign, ago, until, etTime, safeUrl,
  openDetail: (id) => openDetail(id), setTab: (t) => { S.tab = t; render(); },
  panelRight: () => (document.body.classList.contains('holo') ? $('#hud').getBoundingClientRect().right : 0),
  sheetOpen: () => $('#sheet').classList.contains('open'),
  onHoloReady: () => applyLayout(),
};
applyLayout();

load().then(() => {
  const h = location.hash.slice(1);
  if (h && S.data?.instruments.some((i) => i.id === h)) { history.replaceState(null, '', location.pathname); openDetail(h); }
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
</script>
<script src="./holo.js" defer></script>
</body>
</html>
